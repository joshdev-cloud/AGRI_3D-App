[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ── ESP32-S3 PSRAM & USB ────────────────────────────────────────────────────
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; ── Build Flags ──────────────────────────────────────────────────────────────
build_flags =
    ; ── Hardware ─────────────────────────────────────────────────────────────
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; ── Project include paths ─────────────────────────────────────────────────
    -I src/core
    -I src/drivers
    -I src/network
    -I src/routines

    ; ── Edge Impulse SDK include paths ────────────────────────────────────────
    ; Root of AI-agri3d/ so that #include "edge-impulse-sdk/..." resolves
    -I .
    ; Model-specific parameter headers (model_metadata.h, model_variables.h)
    -I model-parameters
    ; Compiled TFLite inference graph header
    -I tflite-model

    ; ── Edge Impulse Required Defines ────────────────────────────────────────
    ; Selects the Espressif porting layer (timing, debug_log, memory helpers)
    -DEI_PORTING_ESPRESSIF=1
    ; Disable dynamic allocation in TFLite Micro (required for bare-metal/RTOS)
    -DTF_LITE_STATIC_MEMORY=1
    ; Keep float filterbank (better accuracy, sufficient RAM on S3 w/ PSRAM)
    -DEIDSP_QUANTIZE_FILTERBANK=0

    ; ── Suppress known-harmless EI SDK compiler warnings ────────────────────
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-sign-compare
    -Wno-missing-field-initializers

; ── Extra Source Files ───────────────────────────────────────────────────────
; PlatformIO's build_src_filter only covers src/ by default.
; We explicitly add the tflite-model and Espressif porting .cpp files here.
build_src_filter =
    +<*>
    +<../tflite-model/*.cpp>
    +<../edge-impulse-sdk/porting/espressif/*.cpp>

; ── Dependencies ─────────────────────────────────────────────────────────────
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    links2004/WebSockets @ ^2.4.1
